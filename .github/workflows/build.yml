name: Build release

# Builds the extension zips and attaches them to a GitHub release.
# - Runs when a release is published from the GitHub UI.
# - Called by deploy.yml (a release created by a workflow does not trigger other workflows).
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach the zips to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      # Parcel's worker threads crash with a segmentation fault on Linux runners (any Node version).
      PARCEL_WORKERS: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package.json version
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$V" ]; then
            echo "::error::Tag $TAG does not match package.json version $V"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Chrome and Firefox
        run: npm run build:all

      # Mozilla may ask for the unminified source code when reviewing the add-on.
      - name: Package
        run: |
          git archive --format=zip --output="build/labonnecarte-$TAG-source.zip" HEAD
          mv build/chrome-mv3-prod.zip  "build/labonnecarte-$TAG-chrome.zip"
          mv build/firefox-mv2-prod.zip "build/labonnecarte-$TAG-firefox.zip"

      - name: Attach zips to the release
        run: gh release upload "$TAG" build/labonnecarte-"$TAG"-*.zip --clobber
