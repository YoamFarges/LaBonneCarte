name: Release

# Push a tag matching the package.json version to release, e.g.:
#   git tag v4.3.0 && git push origin v4.3.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit to the browser stores"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Exposed at job level so the publish step can be skipped when the secret is missing.
      SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${{ steps.version.outputs.version }}"
            exit 1
          fi

      # Release notes = the "## <version>" section of CHANGELOG.md.
      - name: Extract release notes
        run: |
          V=${{ steps.version.outputs.version }}
          awk -v v="$V" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No '## $V' section in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:all

      # Mozilla may ask for the unminified source code when reviewing the add-on.
      - name: Package source code
        run: git archive --format=zip --output=build/labonnecarte-source.zip HEAD

      - name: Rename artifacts
        run: |
          V=${{ steps.version.outputs.version }}
          mv build/chrome-mv3-prod.zip  build/labonnecarte-${V}-chrome.zip
          mv build/firefox-mv2-prod.zip build/labonnecarte-${V}-firefox.zip
          mv build/labonnecarte-source.zip build/labonnecarte-${V}-source.zip

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: build/labonnecarte-*.zip

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: build/labonnecarte-*.zip

      # Requires the SUBMIT_KEYS secret (see https://github.com/PlasmoHQ/bpp#usage).
      # Skipped automatically when the secret is not configured.
      - name: Submit to browser stores
        if: env.SUBMIT_KEYS != '' && (github.ref_type == 'tag' || inputs.publish)
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          chrome-file: build/labonnecarte-${{ steps.version.outputs.version }}-chrome.zip
          firefox-file: build/labonnecarte-${{ steps.version.outputs.version }}-firefox.zip
