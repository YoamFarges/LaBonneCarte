name: Release and deploy

# Run by hand from the Actions tab, on main, once package.json and CHANGELOG.md are up to date:
# 1. checks the store credentials (nothing is created if they are wrong),
# 2. tags the current commit with the package.json version and creates the GitHub release
#    (notes = the matching section of CHANGELOG.md),
# 3. builds the zips and attaches them to the release (build.yml),
# 4. sends them to the Chrome Web Store and Firefox Add-ons (stores.yml).
#
# Store secrets (a store is skipped when its secrets are missing):
#   CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
#   FIREFOX_API_KEY, FIREFOX_API_SECRET, FIREFOX_EXT_ID
on:
  workflow_dispatch:
    inputs:
      stores:
        description: "Stores: publish = upload and submit for review, draft = upload only (submit by hand in the dashboard), skip = GitHub release only"
        type: choice
        options: [publish, draft, skip]
        default: publish

permissions:
  contents: write

env:
  CHROME_EXT_ID: oegacpncaonolgbpmphcimodilfoacnl

jobs:
  check-stores:
    if: github.ref == 'refs/heads/main' && inputs.stores != 'skip'
    runs-on: ubuntu-latest
    env:
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
    steps:
      - name: Check Chrome Web Store credentials
        run: |
          if [ -z "$CHROME_CLIENT_ID" ] || [ -z "$CHROME_CLIENT_SECRET" ] || [ -z "$CHROME_REFRESH_TOKEN" ]; then
            if [ -z "$FIREFOX_API_KEY" ]; then
              echo "::error::No store secrets set. Run with stores=skip or add the secrets."
              exit 1
            fi
            echo "Chrome secrets not set: Chrome will be skipped."
            exit 0
          fi

          token=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CHROME_CLIENT_ID" \
            --data-urlencode "client_secret=$CHROME_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CHROME_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Google refused the Chrome credentials (client id / secret / refresh token)."
            exit 1
          fi
          echo "::add-mask::$token"

          status=$(curl -sS -o item.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CHROME_EXT_ID?projection=DRAFT")
          if [ "$status" != "200" ]; then
            echo "::error::Chrome Web Store API answered HTTP $status for $CHROME_EXT_ID (is the Chrome Web Store API enabled, and does this Google account own the extension?)"
            cat item.json
            exit 1
          fi
          echo "Chrome Web Store access OK. Current draft: $(jq -c '{crxVersion, uploadState}' item.json)"

  release:
    needs: check-stores
    # Runs when the check passed, or was skipped because stores=skip.
    if: always() && github.ref == 'refs/heads/main' && (needs.check-stores.result == 'success' || needs.check-stores.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the version was not released yet
        run: |
          V=${{ steps.version.outputs.version }}
          if git ls-remote --exit-code --tags origin "refs/tags/$V" > /dev/null; then
            echo "::error::Tag $V already exists. Bump the version in package.json first."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          V=${{ steps.version.outputs.version }}
          awk -v v="$V" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No '## $V' section in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - name: Create tag and GitHub release
        run: |
          V=${{ steps.version.outputs.version }}
          gh release create "$V" --target "$GITHUB_SHA" --title "$V" --notes-file release-notes.md

  build:
    needs: release
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release.outputs.version }}

  stores:
    needs: [release, build]
    if: always() && needs.build.result == 'success' && inputs.stores != 'skip'
    uses: ./.github/workflows/stores.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      mode: ${{ inputs.stores }}
